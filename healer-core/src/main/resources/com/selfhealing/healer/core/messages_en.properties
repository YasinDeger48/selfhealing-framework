# Healer messages - English (default). Format: java.util.Formatter (%s, %d, %.2f).
# Keys starting with "report." use {0}, {1} placeholders and are rendered by the HTML report.

trace.notFound=[X] Selector not found: %s  (waited %d ms)
trace.notFoundNoWait=[X] Selector not found: %s
trace.cacheHit=1) Cache: healed before (%s) -> %s  [free]
trace.cacheMiss=1) Cache: no entry
trace.heuristic=2) Local heuristic: compared %d candidates with the fingerprint (threshold %.2f, margin %.2f)  [free]
trace.signals=\        signals: %s
trace.accept=\   -> Accepted: %.2f >= %.2f and %.2f ahead of the runner-up
trace.lowScore=\   -> Not confident: best score %.2f < threshold %.2f
trace.tooClose=\   -> Not confident: top two candidates too close (margin %.2f < %.2f)
trace.llmRequest=3) Claude (%s): sent the best %d candidates as a numbered list
trace.llmNone=\   -> %.1f s, Claude found no match (-1)%s
trace.llmCost=, %,d input / %,d output tokens = %s
trace.llmAnswer=\   -> %.1f s, chose: %s, confidence %.2f%s
trace.llmReason=\   -> Reasoning: %s
trace.privacy=\   -> Privacy: %d value(s) masked before sending (%s)
trace.llmEscalate=\   -> %s is not confident, escalating to %s
trace.validate=4) Validation: %s matches %d element(s) on the page -> %s
trace.validateOk=OK
trace.validateRejected=REJECTED
trace.healed=[!] HEALED (%s, %.2f): %s  - cost %s (%s) -> test continues, reported as WARN
trace.changes=\    changed: %s
trace.failed=[X] NOT HEALED: %s
