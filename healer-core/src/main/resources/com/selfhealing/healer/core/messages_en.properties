report.catHint.LOCATOR=The element was not found and could not be healed: it was removed or changed beyond recognition. Check whether the feature changed - this may be a real bug.
report.catHint.POPUP=Another element covered the target and could not be closed. Handle the layer in the test or ask the team whether it should appear.
report.catHint.ASSERTION=The page did something other than the test expects. Compare the screenshot with the expected value - either the application or the expectation changed.
report.catHint.TIMEOUT=Something did not happen in time: a slow page, an element that never reached the expected state, or an endless spinner.
report.catHint.NETWORK=The application or an API was unreachable or answered with errors. Check the environment and the server logs before the test.
report.catHint.ENVIRONMENT=A browser, driver or machine problem - not the application. Re-run; check the agent if it repeats.
report.catHint.TEST_CODE=An error in the test code or its setup (e.g. NullPointerException, a missing dependency, an undefined step). Fix the test.
report.catHint.UNKNOWN=No known pattern - see the error and the steps.
