trace.tooClose=\   -> Нет уверенности: два лучших кандидата слишком близки (отрыв %.2f < %.2f)
trace.llmRequest=3) Claude (%s): отправлены лучшие %d кандидатов пронумерованным списком
trace.llmNone=\   -> %.1f с, Claude не нашёл совпадения (-1)%s
trace.llmCost=, %,d входных / %,d выходных токенов = %s
trace.llmAnswer=\   -> %.1f с, выбран: %s, уверенность %.2f%s
trace.llmReason=\   -> Обоснование: %s
trace.privacy=\   -> Конфиденциальность: перед отправкой скрыто значений: %d (%s)
trace.llmEscalate=\   -> %s не уверен, передаём %s
trace.validate=4) Проверка: %s соответствует %d элемент(ам) на странице -> %s
trace.validateOk=OK
trace.validateRejected=ОТКЛОНЕНО
trace.healed=[!] ИСПРАВЛЕНО (%s, %.2f): %s  - стоимость %s (%s) -> тест продолжается, отмечен как WARN
trace.changes=\    изменено: %s
trace.failed=[X] НЕ ИСПРАВЛЕНО: %s
