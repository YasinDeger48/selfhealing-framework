report.catHint.NETWORK=Anwendung oder API war nicht erreichbar oder antwortete mit Fehlern. Umgebung und Serverlogs prüfen.
report.catHint.ENVIRONMENT=Browser-, Treiber- oder Maschinenproblem - nicht die Anwendung. Erneut ausführen; bei Wiederholung den Agent prüfen.
