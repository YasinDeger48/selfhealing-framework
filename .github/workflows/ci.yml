name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: Playwright's Chromium and Chrome for Selenium. Windows: the preinstalled Edge, as on most dev machines.
          - { os: ubuntu-latest,  java: "17", install: "install --with-deps chromium ffmpeg", browsers: "-Dbrowser.channel=chromium -Dselenium.browser=chrome" }
          - { os: ubuntu-latest,  java: "21", install: "install --with-deps chromium ffmpeg", browsers: "-Dbrowser.channel=chromium -Dselenium.browser=chrome" }
          - { os: ubuntu-latest,  java: "25", install: "install --with-deps chromium ffmpeg", browsers: "-Dbrowser.channel=chromium -Dselenium.browser=chrome" }
          - { os: windows-latest, java: "17", install: "install ffmpeg",                      browsers: "-Dbrowser.channel=msedge -Dselenium.browser=edge" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # The tests skip browser downloads (locally they use the installed Edge), so the browser, ffmpeg (video) and
      # the system libraries are installed here with the Playwright CLI of the exact Playwright version in use.
      - name: Install browsers
        run: |
          mvn -B -q install -DskipTests
          mvn -B -q -pl healer-playwright exec:java -Dexec.mainClass=com.microsoft.playwright.CLI \
              -Dexec.args="${{ matrix.install }}" -Dexec.classpathScope=test

      # Unit tests, browser integration tests and the accuracy benchmark (fails on any wrong heal
      # or on accuracy below the thresholds in HealingBenchmarkTest). No API key: Claude is not called.
      - name: Build and test
        run: mvn -B install ${{ matrix.browsers }}

      - name: Benchmark summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.java == '17'
        run: cat healer-playwright/target/healer-benchmark/benchmark.md >> "$GITHUB_STEP_SUMMARY" || true

      # Failed tests as annotations: visible on the run and the pull request without downloading anything.
      - name: Annotate failed tests
        if: failure()
        run: |
          $(command -v python3 || command -v python) - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      msg = (bad.get("message") or bad.text or "").replace("\n", " ")[:900]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          EOF

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}-java${{ matrix.java }}
          path: "**/target/surefire-reports/"

  # The framework in a Gradle project, used like any user would (integration/gradle-junit5).
  gradle:
    name: Gradle project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Framework into the local Maven repository
        run: |
          mvn -B -q install -DskipTests
          mvn -B -q -pl healer-playwright exec:java -Dexec.mainClass=com.microsoft.playwright.CLI \
              -Dexec.args="install --with-deps chromium" -Dexec.classpathScope=test

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      # .mvn/maven.config uses paths relative to the repository root, so the version is read there
      - name: Framework version
        id: version
        run: echo "version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Gradle test
        working-directory: integration/gradle-junit5
        run: |
          gradle --no-daemon test -PhealerVersion="${{ steps.version.outputs.version }}" -Pbrowser=chromium
          python3 check-report.py
