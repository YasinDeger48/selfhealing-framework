name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # System libraries for Chromium; Playwright for Java downloads the matching browser itself on first use.
      - name: Install browser dependencies
        run: npx --yes playwright install-deps chromium

      # Unit tests, browser integration tests and the accuracy benchmark (fails on any wrong heal
      # or on accuracy below the thresholds in HealingBenchmarkTest). No API key: Claude is not called.
      - name: Build and test
        run: mvn -B install -Dbrowser.channel=chromium

      - name: Benchmark summary
        if: always()
        run: cat healer-playwright/target/healer-benchmark/benchmark.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
