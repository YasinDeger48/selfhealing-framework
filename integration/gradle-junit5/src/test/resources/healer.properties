# Gradle check - Playwright + JUnit 5
#
# Settings of the self-healing framework (io.github.yasindeger48:healer-*). Where values come from, later wins:
#   1. this file
#   2. healer-<profile>.properties   (-Dhealer.profile=ci  or  HEALER_PROFILE=ci)
#   3. healer-local.properties       (your own overrides - not committed)
#   4. environment variables          HEALER_MODE=off, BROWSER_HEADLESS=false, APP_BASEURL=...
#   5. -D on the command line         mvn test -Dbrowser.headless=false -Dhealer.enabled=false
# Values may reference ${env:NAME:-default} or ${sys:name}; a trailing "# comment" is ignored.

# ---- Application -----------------------------------------------------------------------------------------
# Address of the application under test - HealerBrowser.url("/login") / HealerDriver.url(...)
app.baseUrl=

# ---- Browser ---------------------------------------------------------------------------------------------
# chromium | msedge | chrome | firefox | webkit
browser.name=msedge
# true = no window; false = watch the run
browser.headless=true
# Milliseconds between browser actions - e.g. 300 to follow a run with your eyes
browser.slowmo=0
# Window / viewport size
browser.viewport=1280x900
# Default timeout of actions (Playwright) / page loads (Selenium), ms
browser.timeoutMs=15000
# off | failures | all - video of the test, linked in the report
browser.video=off
# off | failures | all - Playwright trace (npx playwright show-trace file.zip)
browser.trace=off

# ---- Healing ---------------------------------------------------------------------------------------------
# false = healer switched off completely: plain locators, no report, no analysis
healer.enabled=true
# auto = heal and continue (WARN) | suggest = report the replacement, fail the step | off = no healing
healer.mode=auto
# How long the original selector may take before it counts as broken (SPA render delay), ms
healer.probeTimeoutMs=800
# Matches scoring below this are rejected
healer.minConfidence=0.60
# The best match must beat the runner-up by this much (no guessing between look-alikes)
healer.minMargin=0.08
# true = a healed test fails instead of passing with WARN (strict CI)
healer.failOnHeal=false
# auto = close cookie banners / overlays covering an element | off
healer.popups=auto
# Code fixes for healed locators: patch (locator-fixes.patch) | apply (edit the sources) | off
healer.fix=patch
# Learned fingerprints and heals - commit this folder to share them
healer.storeDir=build/healer-store

# ---- AI stage (Claude) - needs the healer-claude dependency ----------------------------------------------
# true = ask Claude when the local matching is not sure (about $0.002 per heal)
healer.llm.enabled=false
# API key - default: the ANTHROPIC_API_KEY environment variable. Never write the key itself here
#healer.llm.apiKey=${env:ANTHROPIC_API_KEY}
# First model asked
healer.llm.model=claude-haiku-4-5
# Asked when the first model is not sure (empty = never)
healer.llm.escalateTo=claude-opus-5
# USD budget per run - Claude is skipped after it (no limit when not set)
#healer.llm.maxCostPerRun=1.00
# Claude calls per run at most
healer.llm.maxCallsPerRun=50

# ---- Report ----------------------------------------------------------------------------------------------
# en | de | ru | ja | tr | ar - console, report and Claude's explanations
healer.language=en
# Where the report is written
healer.reportDir=build/healer-report
# Open the HTML report after the run: never | always | onFailure | onWarn (never on CI)
healer.report.open=never
# Also write a PDF: auto (not on CI) | true | false
healer.report.pdf=false
# all | failures | none
healer.report.screenshots=all
# true = keep every run's report in history/<time>/
healer.report.history=false
# Print every healing step to the console
healer.verbose=false
# Draw the healing steps on the page - for headed demos
healer.visual=false
